name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Release impact for unreleased changes already on master
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_channel:
        description: Stable release or an immutable alpha/beta candidate
        required: true
        default: stable
        type: choice
        options: [stable, alpha, beta]
      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@12cda64cf750cfb401a1072853ca6400d9a309e3 # v0.4.1 + #73
    with:
      module-name: ConfluencePS
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      major-authorization: ${{ inputs.major_authorization }}
      smoke-profile: confluence
    secrets: inherit
