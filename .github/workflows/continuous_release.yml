name: Continuous Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_impact:
        description: Release impact for the changes being packaged
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_channel:
        description: Stable release or an immutable alpha/beta candidate
        required: true
        default: stable
        type: choice
        options: [stable, alpha, beta]
      major_authorization:
        description: Fresh major authorization as owner/repository vMAJOR
        required: false
        type: string
      prerelease_branch:
        description: Optional source branch for alpha/beta (empty uses master)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.CONFLUENCEPS_CD_ENABLED == 'true'
    uses: AtlassianPS/AtlassianPS.Standards/.github/workflows/module_release.yml@7efc986344a4e8c4ffb108d5e3b69f45ef3857c4 # v0.5.0
    with:
      module-name: ConfluencePS
      release-impact: ${{ inputs.release_impact }}
      release-channel: ${{ inputs.release_channel || 'stable' }}
      prerelease-branch: ${{ inputs.prerelease_branch }}
      major-authorization: ${{ inputs.major_authorization }}
      smoke-profile: confluence
    secrets: inherit
