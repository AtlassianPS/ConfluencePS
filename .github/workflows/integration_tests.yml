name: Integration Tests

# Cloud + Data Center tracks share this workflow's weekly cron and manual
# dispatch but run independently in parallel jobs.
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      track:
        description: "Which integration track to run"
        required: false
        default: both
        type: choice
        options:
          - cloud
          - datacenter
          - both
      debug:
        description: "Upload Data Center container logs even when tests succeed"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud_integration_tests:
    name: Full Integration Tests (Cloud)
    if: (github.event_name == 'schedule' && github.repository == 'AtlassianPS/ConfluencePS') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.track == 'cloud' || inputs.track == 'both'))
    runs-on: ubuntu-latest
    env:
      CI_CONFLUENCE_TYPE: Cloud
      CONFLUENCE_CLOUD_URL: ${{ vars.CONFLUENCE_CLOUD_URL }}
      ATLASSIAN_CLOUD_USER: ${{ vars.ATLASSIAN_CLOUD_USER }}
      ATLASSIAN_CLOUD_PAT: ${{ secrets.ATLASSIAN_CLOUD_PAT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/setup-powershell@8a75c583308d27526f29d7aaef1d1ba67c059103 # v0.3.0

      - name: Run Cloud-tagged integration tests
        run: |
          Invoke-Build -Task TestIntegration -Tag 'Cloud' -PesterVerbosity Detailed
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Cloud-Integration-Tests
          path: Test-Integration.xml
          retention-days: 14
        if: always()

  datacenter_integration_tests:
    name: Data Center Integration Tests (Dockerized Confluence)
    if: (github.event_name == 'schedule' && github.repository == 'AtlassianPS/ConfluencePS') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.track == 'datacenter' || inputs.track == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI_CONFLUENCE_TYPE: DataCenter
      CI_CONFLUENCE_URL: http://localhost:1990/confluence
      CI_CONFLUENCE_USER: admin
      CI_CONFLUENCE_PASSWORD: admin
      CONFLUENCE_ALLOW_UNENCRYPTED_AUTH: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Confluence Data Center container
        run: docker compose up -d
        shell: bash

      - uses: AtlassianPS/AtlassianPS.Standards/.github/actions/setup-powershell@8a75c583308d27526f29d7aaef1d1ba67c059103 # v0.3.0

      - name: Wait for Confluence to become reachable
        run: ./Tools/Wait-ConfluenceServer.ps1 -TimeoutSeconds 1500
        shell: pwsh

      - name: Run DataCenter-tagged integration tests
        timeout-minutes: 60
        run: |
          Invoke-Build -Task TestIntegration -Tag 'DataCenter' -PesterVerbosity Detailed
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DataCenter-Integration-Tests
          path: Test-Integration.xml
          retention-days: 14
        if: always()

      - name: Capture Confluence container logs for debugging
        if: ${{ failure() || inputs.debug || runner.debug == '1' }}
        run: docker compose logs confluence > confluence-container.log
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DataCenter-Confluence-Container-Logs
          path: confluence-container.log
          retention-days: 7
        if: ${{ failure() || inputs.debug || runner.debug == '1' }}

      - name: Tear down Confluence Data Center container
        if: always()
        run: docker compose down -v
        shell: bash
